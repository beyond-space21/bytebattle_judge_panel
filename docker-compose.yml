services:
  postgres:
    image: postgres:16-alpine
    container_name: judge-postgres
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: judge
      POSTGRES_DB: judge
    ports:
      - "5432:5432"
    volumes:
      - judge_pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge -d judge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: judge-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8759:8759"
    environment:
      HTTP_ADDR: ":8759"
      DATABASE_URL: postgres://judge:judge@postgres:5432/judge?sslmode=disable
      JUDGE0_URL: http://judge0-server:2358
      JUDGE_BACKEND: ${JUDGE_BACKEND:-local}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PYTHON_LANGUAGE_ID: ${PYTHON_LANGUAGE_ID:-71}
    restart: unless-stopped

  # Judge0 dependencies
  judge0-redis:
    image: redis:7-alpine
    container_name: judge0-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - judge0_redis:/data
    restart: unless-stopped
    profiles: ["judge0", "full"]

  judge0-db:
    image: postgres:16-alpine
    container_name: judge0-db
    environment:
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
      POSTGRES_DB: judge0
    volumes:
      - judge0_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles: ["judge0", "full"]

  judge0-server:
    image: judge0/judge0:1.13.0
    container_name: judge0-server
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_started
    volumes:
      - ./deploy/judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "2358:2358"
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    restart: unless-stopped
    profiles: ["judge0", "full"]

  judge0-workers:
    image: judge0/judge0:1.13.0
    container_name: judge0-workers
    command: ["./scripts/workers"]
    privileged: true
    depends_on:
      judge0-db:
        condition: service_healthy
      judge0-redis:
        condition: service_started
    volumes:
      - ./deploy/judge0.conf:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      REDIS_HOST: judge0-redis
      POSTGRES_HOST: judge0-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    restart: unless-stopped
    profiles: ["judge0", "full"]

volumes:
  judge_pgdata:
  judge0_pgdata:
  judge0_redis:
